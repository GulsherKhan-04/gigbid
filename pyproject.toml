[project]
name = "gigbid"
version = "1.0.0"
description = "GigBid: a multi-agent freelancer copilot (AI-4016)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.2", "uvicorn[standard]==0.54.0", "pydantic==2.14.3", "pyyaml==6.0.3", "python-dotenv==1.2.4",
  "langgraph==1.2.20", "langchain-core==1.7.6", "langgraph-checkpoint-postgres==3.2.0",
  "langgraph-checkpoint-sqlite==3.1.3", "langchain-mcp-adapters==0.3.2", "mcp==1.30.0", "httpx==0.28.1",
  "rank-bm25==0.2.2", "numpy==2.5.4", "pypdf==7.0.0", "sqlalchemy==2.1.8", "aiosqlite==0.22.1",
  "psycopg[binary]==3.3.8", "pyjwt==2.15.1", "cryptography==50.0.2", "arq==0.28.0", "redis==5.3.1",
  "sse-starlette==3.7.0", "langgraph-supervisor==0.0.31", "langchain-openai==1.7.4",
]

[project.optional-dependencies]
rerank = ["fastembed"]                     # V3 cross-encoder on CPU
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff"]

[project.scripts]
portfolio-mcp = "mcp_servers.portfolio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "rag*", "mcp_servers*", "apps*", "worker*", "evals*"]

[tool.setuptools.package-data]
agent = ["config.yaml", "prompts/*.md"]

[tool.ruff]
line-length = 120
