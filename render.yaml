# Render Blueprint: on render.com click New > Blueprint, pick this repo, then paste the secret values it asks for.
databases:
  - name: gigbid-db
    plan: free
    databaseName: gigbid
    user: gigbid
services:
  - type: web
    name: gigbid
    runtime: docker
    dockerfilePath: ./infra/docker/python.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: gigbid-db, property: connectionString }
      - { key: EMBEDDINGS_PROVIDER, value: fastembed }
      - { key: MARKETPLACE_BACKEND, value: gigsim }
      - { key: GIGSIM_BASE_URL, value: http://127.0.0.1:8081 }
      - { key: START_SIMULATOR, value: "1" }
      - { key: MCP_TRANSPORT, value: stdio }
      - { key: MODEL_PROFILE, value: open }
      - { key: LLM_BASE_URL, value: https://api.groq.com/openai/v1 }
      - { key: LANGSMITH_TRACING, value: "true" }
      - { key: LANGSMITH_PROJECT, value: gigbid }
      - { key: REVIEWER_EMAIL, value: reviewer@gigbid.dev }
      - { key: APP_SECRET_KEY, generateValue: true }
      - { key: LLM_API_KEY, sync: false }          # paste from your .env
      - { key: LANGSMITH_API_KEY, sync: false }    # paste from your .env
      - { key: TOKEN_ENCRYPTION_KEY, sync: false } # paste from your .env
      - { key: REVIEWER_PASSWORD, sync: false }    # paste from your .env
      - { key: GITHUB_TOKEN, sync: false }         # paste from your .env
      - { key: CORS_ORIGINS, sync: false }         # your Render URL, e.g. https://gigbid.onrender.com
