name: eval
on: [pull_request]
jobs:
  smoke-eval:
    runs-on: ubuntu-latest
    if: ${{ secrets.LLM_API_KEY != '' }}
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.groq.com/openai/v1' }}
      EMBEDDINGS_PROVIDER: hash
      MARKETPLACE_BACKEND: fixtures
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: python -m evals.runners.decision_eval --limit 30 --name smoke
      - name: Gate on thresholds
        run: python -m evals.runners.gate
